services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SERVER_PORT: 3001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_SEARCH_MODEL: ${AI_SEARCH_MODEL:-}
      AI_SEARCH_TIMEOUT_MS: ${AI_SEARCH_TIMEOUT_MS:-}
    # Not published to the host — only nginx (the `client` service) is, and
    # it reaches this over the compose network by service name. The API key
    # lives only here; the client build never sees it.
    expose:
      - '3001'

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '${CLIENT_PORT:-8080}:80'
    depends_on:
      - server
