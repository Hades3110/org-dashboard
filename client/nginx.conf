server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  root /usr/share/nginx/html;
  index index.html;

  # SSE needs its own block: proxy_buffering off is what lets patches reach
  # the browser as they're written instead of nginx batching the response.
  # `server` is the compose service name, resolved via Docker's internal DNS.
  location /api/stream {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://server:3001;
  }

  location / {
    try_files $uri /index.html;
  }
}
